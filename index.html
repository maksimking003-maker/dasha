<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения!</title>
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.24.4/dist/function-plot.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; background:#fff5f8; margin:0; padding:20px; }
  h1 { color:#e91e63; font-size: 22px; }
  input { width:45px; padding:5px; margin:2px; border-radius:6px; border:1px solid #e91e63; text-align: center; font-size: 16px; font-weight: bold; color: #333; }
  #plot { width:100%; max-width:600px; margin: 10px auto; }
  .hint { color:#888; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Подбери правильные коэффициенты 🎂</h1>
  <div>
    y = <input id="a" type="number" value="1"> x² +
        <input id="b" type="number" value="0"> x +
        <input id="c" type="number" value="0">
  </div>
  <div id="plot"></div>
  <p class="hint">Подсказка: парабола ветвями вниз — это a = -1 😉</p>
  
  <script>
    const inputs = ['a','b','c'].map(id => document.getElementById(id));
    function draw() {
      // Берем значения из полей, если пусто - ставим 0
      const a = parseFloat(inputs[0].value) || 0;
      const b = parseFloat(inputs[1].value) || 0;
      const c = parseFloat(inputs[2].value) || 0;
      
      functionPlot({
        target: '#plot',
        width: window.innerWidth > 600 ? 600 : window.innerWidth - 40,
        height: 400,
        grid: true,
        xAxis: { domain: [-8, 8] },
        yAxis: { domain: [-8, 8] },
        data: [
          // Твоя парабола
          { fn: `${a}*x^2 + ${b}*x + ${c}`, color: '#2196f3', graphType: 'polyline' },
          // Сердечко (записал через y^2 для стабильности)
          { x: '(x^2+y^2-1)^3 - x^2*y^3 = 0', color: '#e91e63', graphType: 'implicit' }
        ]
      });
    }
    
    // Рисуем при загрузке
    draw();
    // Перерисовываем при вводе
    inputs.forEach(i => i.addEventListener('input', draw));
  </script>
</body>
</html>
