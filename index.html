<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения!</title>
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.24.4/dist/function-plot.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; background:#fff5f8; margin:0; padding:20px; overflow-x: hidden; }
  h1 { color:#e91e63; font-size: 22px; margin-bottom: 10px; }
  input { width:45px; padding:5px; margin:2px; border-radius:6px; border:1px solid #e91e63; text-align: center; font-size: 16px; font-weight: bold; color: #333; outline: none;}
  input:focus { border-color: #ff1493; box-shadow: 0 0 5px rgba(233,30,99,0.5); }
  
  .plot-container { position: relative; width: 100%; max-width: 600px; margin: 10px auto; }
  #plot { width:100%; height: 400px; }
  
  /* Вот наше сердечко поверх графика */
  .heart-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    color: rgba(233, 30, 99, 0.15); /* Полупрозрачное, чтобы не мешать графику */
    pointer-events: none; /* Чтобы не блокировало клики по графику */
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .hint { color:#888; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Подбери правильные коэффициенты 🎂</h1>
  <div>
    y = <input id="a" type="number" value="1"> x² +
        <input id="b" type="number" value="0"> x +
        <input id="c" type="number" value="0">
  </div>
  
  <div class="plot-container">
    <div id="plot"></div>
    <div class="heart-overlay">❤️</div>
  </div>
  
  <p class="hint">Подсказка: парабола ветвями вниз — это a = -1 😉</p>
  
  <script>
    const inputs = ['a','b','c'].map(id => document.getElementById(id));
    function draw() {
      const a = parseFloat(inputs[0].value) || 0;
      const b = parseFloat(inputs[1].value) || 0;
      const c = parseFloat(inputs[2].value) || 0;
      
      functionPlot({
        target: '#plot',
        width: document.getElementById('plot').clientWidth,
        height: 400,
        grid: true,
        xAxis: { domain: [-8, 8] },
        yAxis: { domain: [-8, 8] },
        data: [
          { fn: `${a}*x^2 + ${b}*x + ${c}`, color: '#2196f3', graphType: 'polyline' }
        ]
      });
    }
    
    draw();
    inputs.forEach(i => i.addEventListener('input', draw));
    
    // Перерисовываем при повороте экрана
    window.addEventListener('resize', draw);
  </script>
</body>
</html>
